name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './.tmp/*' -print0 | xargs -0 -n1 php -l
          php -l config.inc.php.dist

  style:
    name: Coding style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check coding style
        run: composer cs

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer phpstan

      - name: Smoke test plugin against Roundcube
        run: php -r "require 'vendor/autoload.php'; require 'email_domains_mapper.php'; var_dump(email_domains_mapper::info());"

  composer:
    name: Composer validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build archive
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          stage="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$src"
          mkdir -p "$stage/email_domains_mapper"
          rsync -a --exclude-from=.distignore "$src/" "$stage/email_domains_mapper/"
          mkdir -p dist
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/email_domains_mapper.zip" email_domains_mapper)
          tar -C "$stage" -czf "$GITHUB_WORKSPACE/dist/roundcube-email_domains_mapper.tar.gz" email_domains_mapper

      - name: Verify archive contents
        run: |
          set -euo pipefail
          unzip -Z1 dist/email_domains_mapper.zip | sort > /tmp/ziplist
          tar -tzf dist/roundcube-email_domains_mapper.tar.gz | sort > /tmp/tarlist
          for list in /tmp/ziplist /tmp/tarlist; do
            grep -qx 'email_domains_mapper/email_domains_mapper.php' "$list"
            grep -qx 'email_domains_mapper/composer.json' "$list"
            grep -qx 'email_domains_mapper/config.inc.php.dist' "$list"
            grep -qx 'email_domains_mapper/LICENSE' "$list"
            grep -qx 'email_domains_mapper/README.md' "$list"
            grep -qx 'email_domains_mapper/CHANGELOG.md' "$list"
            if grep -qx 'email_domains_mapper/config.inc.php' "$list"; then
              echo "Archive leaks config.inc.php"
              exit 1
            fi
          done

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test