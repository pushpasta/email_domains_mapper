name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          plugin_version="$(sed -n "s/.*'version'[[:space:]]*=>[[:space:]]*'\([^']*\)'.*/\1/p" email_domains_mapper.php | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=$plugin_version" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches plugin version
        if: steps.version.outputs.tagged == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          plugin_version="$(sed -n "s/.*'version'[[:space:]]*=>[[:space:]]*'\([^']*\)'.*/\1/p" email_domains_mapper.php | head -1)"
          if [[ "$plugin_version" != "$VERSION" ]]; then
            echo "Tag v$VERSION does not match plugin version $plugin_version"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Build archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          stage="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$src"
          mkdir -p "$stage/email_domains_mapper"
          rsync -a --exclude-from=.distignore "$src/" "$stage/email_domains_mapper/"
          mkdir -p dist
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/email_domains_mapper-$VERSION.zip" email_domains_mapper)
          tar -C "$stage" -czf "dist/roundcube-email_domains_mapper-$VERSION.tar.gz" email_domains_mapper

      - name: Verify archive contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ziplist="$(mktemp)"
          tarlist="$(mktemp)"
          unzip -Z1 "dist/email_domains_mapper-$VERSION.zip" | sort > "$ziplist"
          tar -tzf "dist/roundcube-email_domains_mapper-$VERSION.tar.gz" | sort > "$tarlist"

          for list in "$ziplist" "$tarlist"; do
            echo "=== $(basename "$list") ==="
            cat "$list"
            echo
            grep -qx 'email_domains_mapper/email_domains_mapper.php' "$list"
            grep -qx 'email_domains_mapper/composer.json' "$list"
            grep -qx 'email_domains_mapper/config.inc.php.dist' "$list"
            grep -qx 'email_domains_mapper/LICENSE' "$list"
            grep -qx 'email_domains_mapper/README.md' "$list"
            if grep -E '^email_domains_mapper/(\.github/|tests/|\.tmp/|AGENTS\.md$|\.distignore$|\.gitattributes$|\.editorconfig$|\.gitignore$|phpunit\.xml|config\.inc\.php$)' "$list"; then
              echo "Archive leaks excluded paths"
              exit 1
            fi
          done

      - name: Upload build artifacts (dry run)
        if: steps.version.outputs.tagged != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Create GitHub release
        if: steps.version.outputs.tagged == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/email_domains_mapper-${{ steps.version.outputs.version }}.zip
            dist/roundcube-email_domains_mapper-${{ steps.version.outputs.version }}.tar.gz
          body: |
            ## Install manually

            Extract into the Roundcube `plugins/` directory:

            ```bash
            cd /path/to/roundcubemail/plugins
            unzip email_domains_mapper-${{ steps.version.outputs.version }}.zip
            # or: tar -xzf roundcube-email_domains_mapper-${{ steps.version.outputs.version }}.tar.gz
            ```

            Then copy `plugins/email_domains_mapper/config.inc.php.dist` to
            `config.inc.php`, edit your domain mappings, and enable
            `email_domains_mapper` before `managesieve` in `$config['plugins']`.
            See the [README](https://github.com/pushpasta/email_domains_mapper#configuration)
            for details.

            ## Install with Composer

            ```bash
            composer require pushpasta/email_domains_mapper:${{ steps.version.outputs.version }}
            ```
