name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          plugin_version="$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" email_domains_mapper.php | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            {
              echo "tagged=true"
              echo "tag=$GITHUB_REF_NAME"
              echo "version=${GITHUB_REF_NAME#v}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tagged=false"
              echo "tag="
              echo "version=$plugin_version"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches plugin version
        if: steps.version.outputs.tagged == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          plugin_version="$(sed -n "s/.*const VERSION = '\([^']*\)'.*/\1/p" email_domains_mapper.php | head -1)"
          if [[ "$plugin_version" != "$VERSION" ]]; then
            echo "Tag v$VERSION does not match plugin version $plugin_version"
            exit 1
          fi

      - name: Verify changelog entry
        if: steps.version.outputs.tagged == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -Eq "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for version $VERSION"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Build archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          src="$(mktemp -d)"
          stage="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$src"
          mkdir -p "$stage/email_domains_mapper"
          rsync -a --exclude-from=.distignore "$src/" "$stage/email_domains_mapper/"
          mkdir -p dist
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/email_domains_mapper-$VERSION.zip" email_domains_mapper)
          tar -C "$stage" -czf "dist/roundcube-email_domains_mapper-$VERSION.tar.gz" email_domains_mapper

      - name: Verify archive contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ziplist="$(mktemp)"
          tarlist="$(mktemp)"
          unzip -Z1 "dist/email_domains_mapper-$VERSION.zip" | sort > "$ziplist"
          tar -tzf "dist/roundcube-email_domains_mapper-$VERSION.tar.gz" | sort > "$tarlist"

          for list in "$ziplist" "$tarlist"; do
            echo "=== $(basename "$list") ==="
            cat "$list"
            echo
            grep -qx 'email_domains_mapper/email_domains_mapper.php' "$list"
            grep -qx 'email_domains_mapper/composer.json' "$list"
            grep -qx 'email_domains_mapper/config.inc.php.dist' "$list"
            grep -qx 'email_domains_mapper/LICENSE' "$list"
            grep -qx 'email_domains_mapper/README.md' "$list"
            grep -qx 'email_domains_mapper/CHANGELOG.md' "$list"
            while IFS= read -r entry; do
              case "$entry" in
                ''|'#'*) continue ;;
              esac
              entry="${entry#/}"
              while IFS= read -r path; do
                case "$path" in
                  "email_domains_mapper/$entry"|"email_domains_mapper/$entry"/*)
                    echo "Archive leaks path excluded by .distignore: $entry"
                    exit 1
                    ;;
                esac
              done < "$list"
            done < .distignore
            if grep -qx 'email_domains_mapper/config.inc.php' "$list"; then
              echo "Archive leaks config.inc.php"
              exit 1
            fi
          done

      - name: Upload build artifacts (dry run)
        if: steps.version.outputs.tagged != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/build-release-notes.sh "$VERSION" dist/release-notes.md

      - name: Build checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum email_domains_mapper-*.zip roundcube-email_domains_mapper-*.tar.gz > checksums.txt
          cd ..

      - name: Create GitHub release
        if: steps.version.outputs.tagged == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.tag }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: dist/release-notes.md
          files: |
            dist/email_domains_mapper-${{ steps.version.outputs.version }}.zip
            dist/roundcube-email_domains_mapper-${{ steps.version.outputs.version }}.tar.gz
            dist/checksums.txt
